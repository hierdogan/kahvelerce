<style>
  :root {
    color-scheme: light;
    --rust: #A6432A; --rust-deep: #86331F;
    --bg: #F5EFE6; --paper: #FFFDF9; --ink: #2B1B12; --ink-soft: #6B5546;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; min-height: 100vh; min-height: 100dvh; }
  .top-inner { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; }
  .brand span { color: var(--ink-soft); font-weight: 400; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  svg { display: block; width: 150px; height: auto; margin: 0 0 20px; }
  h1 { font-family: var(--serif); font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; font-size: clamp(2rem, 9vw, 2.6rem); margin: 0 0 12px; }
  p { color: var(--ink-soft); margin: 0 0 28px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .cta, .ghost { display: inline-flex; justify-content: center; align-items: center; min-height: 52px; padding: 12px 24px; border-radius: 999px; font-weight: 700; text-decoration: none; }
  .cta { background: var(--rust); color: #fff; box-shadow: 0 2px 0 var(--rust-deep); }
  .cta:hover { background: var(--rust-deep); }
  .ghost { color: var(--ink); border: 1.5px solid var(--ink); font-weight: 600; }
  .ghost:hover { background: var(--paper); }
  .cta:focus-visible, .ghost:focus-visible, .brand:focus-visible { outline: 3px solid var(--rust); outline-offset: 3px; }

  /* Menü */
  .top-inner { flex-wrap: wrap; row-gap: 0; }
  .nav {
    display: flex; flex-basis: 100%; gap: 8px; padding: 3px 0 4px;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav a {
    flex: none; display: inline-flex; align-items: center; min-height: 36px; padding: 6px 8px;
    border: 1px solid #DCCBB5; border-radius: 999px; background: rgba(255, 253, 249, 0.7);
    white-space: nowrap; font-family: var(--sans); font-size: 0.78rem;
    color: var(--ink-soft); text-decoration: none;
  }
  .nav a:hover { color: var(--ink); border-color: #BE8B4F; }
  .nav a[aria-current="page"] { background: #F4DED4; border-color: #A6432A; color: #86331F; font-weight: 700; }
  .nav a:focus-visible { outline: 3px solid #A6432A; outline-offset: -1px; }
  @media (max-width: 374px) { .nav { gap: 6px; } .nav a { padding: 6px 7px; } }
  @media (min-width: 600px) { .nav a { padding: 6px 12px; font-size: 0.86rem; } }
</style>
