<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bir kahve, kaç karar? · kahvelerce</title>
<meta name="description" content="Kahveni adım adım seç, sonunda tek bir kahve için kaç karar verdiğini gör.">
<meta name="theme-color" content="#F5EFE6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='rotate(30 16 16)'%3E%3Cellipse cx='16' cy='16' rx='10' ry='13' fill='%238E5D37'/%3E%3Cpath d='M16 5 C11 12 21 20 16 27' stroke='%23F5EFE6' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    /* Kahvenin kendi tayfı: çiğ yeşilden koyu kavrulmuşa */
    --roast-1: #A3AE71; /* çiğ çekirdek */
    --roast-2: #C9B877; /* kuruma / sararma */
    --roast-3: #BE8B4F; /* açık kavrum */
    --roast-4: #8E5D37; /* orta kavrum */
    --roast-5: #5C3A22; /* koyu kavrum */
    --roast-6: #2F1E14; /* çok koyu */
    --green-deep: #5F6B3A;
    /* Ayırt edici vurgu: pas / kiremit */
    --rust: #A6432A;
    --rust-deep: #86331F;
    --rust-tint: #F4DED4;
    /* Zemin ve yazı */
    --bg: #F5EFE6;
    --paper: #FFFDF9;
    --ink: #2B1B12;
    --ink-soft: #6B5546;
    --line: #E4D7C5;
    --roast-gradient: linear-gradient(90deg, var(--roast-1), var(--roast-2) 22%, var(--roast-3) 45%, var(--roast-4) 66%, var(--roast-5) 84%, var(--roast-6));
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.5;
    min-height: 100vh;
    min-height: 100dvh;
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; }
  h2:focus, h1:focus { outline: none; }

  /* Üst bar */
  .top {
    position: sticky; top: 0; z-index: 5;
    background: rgba(245, 239, 230, 0.94);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    padding-top: env(safe-area-inset-top);
  }
  .top-inner {
    max-width: 560px; margin: 0 auto; padding: 12px 16px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; }
  .brand span { color: var(--ink-soft); font-weight: 400; }
  .counter {
    background: var(--rust); color: #fff; border-radius: 999px;
    padding: 5px 13px; font-weight: 700; font-size: 0.95rem;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .counter.bump { animation: bump 0.35s ease; }
  @keyframes bump { 40% { transform: scale(1.18); } }
  .progress-wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 10px; }
  .progress {
    position: relative; height: 8px; border-radius: 999px; overflow: hidden;
    background: var(--roast-gradient);
  }
  .progress-cover {
    position: absolute; top: 0; right: 0; bottom: 0; width: 100%;
    background: var(--line); transition: width 0.4s ease;
  }
  [hidden] { display: none !important; }

  /* Ekran */
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
  .screen { padding-top: 12px; transition: opacity 0.2s ease, transform 0.2s ease; }
  .screen.out { opacity: 0; }
  .screen.out.to-left { transform: translateX(-14px); }
  .screen.out.to-right { transform: translateX(14px); }
  .screen.pre { transition: none; opacity: 0; }
  .screen.pre.from-right { transform: translateX(14px); }
  .screen.pre.from-left { transform: translateX(-14px); }

  /* Giriş */
  .intro {
    min-height: calc(100dvh - 90px);
    display: flex; flex-direction: column; justify-content: center;
    padding: 16px 0 40px;
  }
  .intro-art svg { width: min(300px, 82vw); height: auto; display: block; margin: 0 0 14px -6px; }
  .hello {
    position: relative; align-self: flex-start; margin: 0;
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 18px;
    padding: 10px 18px; font-family: var(--serif); font-weight: 700; font-size: 1.3rem; line-height: 1.25;
    box-shadow: 3px 3px 0 var(--rust-tint);
  }
  .hello::after {
    content: ""; position: absolute; left: 24px; bottom: -9px; width: 16px; height: 16px;
    background: var(--paper); border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
    transform: rotate(45deg);
  }
  .hello-by { font-size: 0.85rem; font-style: italic; color: var(--ink-soft); margin: 14px 0 0 6px; }
  .intro h1 { font-size: clamp(2.6rem, 11.5vw, 3.8rem); margin: 0.35em 0 0.3em; line-height: 1.02; }
  .intro h1 em { font-style: normal; color: var(--rust); }
  .lede { font-size: 1.15rem; margin: 0 0 28px; max-width: 30ch; }
  .fine { font-size: 0.85rem; color: var(--ink-soft); margin: 14px 0 0; }

  /* Butonlar */
  .cta {
    display: inline-flex; justify-content: center; align-items: center; gap: 8px;
    min-height: 54px; padding: 14px 26px; border-radius: 999px;
    background: var(--rust); color: #fff; border: 0;
    font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
    box-shadow: 0 2px 0 var(--rust-deep);
    transition: background 0.15s, transform 0.1s;
  }
  .cta:hover { background: var(--rust-deep); }
  .cta:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  .cta:disabled:hover { background: var(--rust); }
  .cta:active { transform: translateY(1px); box-shadow: none; }
  .intro .cta { align-self: flex-start; min-width: 180px; font-size: 1.1rem; }
  .ghost {
    display: inline-flex; justify-content: center; align-items: center;
    min-height: 52px; padding: 12px 22px; border-radius: 999px;
    background: transparent; color: var(--ink); border: 1.5px solid var(--ink);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .ghost:hover { background: var(--paper); }
  .cta:focus-visible, .ghost:focus-visible, .back:focus-visible, .opt:focus-visible, .linkish:focus-visible {
    outline: 3px solid var(--rust); outline-offset: 3px;
  }
  .back {
    appearance: none; border: 0; background: none; color: var(--ink-soft);
    font: inherit; font-size: 0.95rem; cursor: pointer;
    min-height: 44px; padding: 8px 6px; margin: 0 0 2px -6px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .back:hover { color: var(--ink); }

  /* Soru */
  .eyebrow {
    font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--green-deep); font-weight: 700; margin: 6px 0 0;
  }
  .q-title { font-size: clamp(1.65rem, 6.5vw, 2.15rem); margin: 0.25em 0 0.4em; }
  .hint {
    color: var(--ink-soft); font-size: 0.98rem; margin: 0 0 22px;
    padding-left: 12px; border-left: 3px solid var(--rust-tint);
  }
  .options { display: grid; gap: 10px; }
  .options.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .options.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .opt {
    appearance: none; width: 100%; min-height: 58px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; text-align: left;
    border-radius: 14px; border: 1.5px solid var(--line); background: var(--paper);
    color: var(--ink); font: inherit; font-weight: 600; cursor: pointer;
    box-shadow: 0 1px 0 rgba(43, 27, 18, 0.05);
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .cols-2 .opt, .cols-3 .opt { justify-content: center; text-align: center; }
  .opt:hover { border-color: var(--roast-3); }
  .opt:active { transform: scale(0.985); }
  .opt.picked { border-color: var(--rust); background: var(--rust-tint); }
  .opt.was { border-color: var(--rust); }
  .opt .txt { flex: 1; }
  .cols-2 .opt .txt, .cols-3 .opt .txt { flex: initial; }
  .opt small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 0.88rem; margin-top: 2px; }
  .sw { width: 20px; height: 20px; border-radius: 50%; flex: none; border: 1.5px solid rgba(43, 27, 18, 0.18); }
  .tag {
    font-style: normal; font-size: 0.72rem; font-weight: 700; color: var(--rust);
    background: var(--rust-tint); border-radius: 999px; padding: 2px 8px; flex: none;
  }

  /* Sonuç */
  .result { text-align: center; padding-top: 4px; }
  .cupviz svg { width: min(270px, 72vw); height: auto; display: block; margin: 0 auto 6px; }
  .steam path { animation: steam 3.2s ease-in-out infinite; }
  .steam path:nth-child(2) { animation-delay: 0.6s; }
  .steam path:nth-child(3) { animation-delay: 1.2s; }
  @keyframes steam { 0%, 100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 0.6; transform: translateY(-4px); } }
  .coffee-name { font-size: clamp(1.35rem, 5.6vw, 1.8rem); margin: 0.25em auto 0.5em; max-width: 24ch; }
  .verdict { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 10px 0 6px; font-size: 1.08rem; }
  .verdict strong { font-family: var(--serif); font-size: clamp(3.3rem, 17vw, 4.6rem); line-height: 1; color: var(--rust); }
  .verdict .num { font-variant-numeric: tabular-nums; }
  .quip { font-style: italic; color: var(--ink-soft); margin: 4px 0 0; }
  .stat {
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; font-size: 0.95rem; text-align: left; margin: 22px 0;
  }
  .stat b { color: var(--green-deep); font-variant-numeric: tabular-nums; }
  .recap-title { font-size: 1.2rem; text-align: left; margin: 0 0 8px; }
  .recap { list-style: none; padding: 0; margin: 0 0 26px; text-align: left; counter-reset: r; border-top: 1px solid var(--line); }
  .recap li {
    counter-increment: r; display: grid; grid-template-columns: 2em 1fr auto; gap: 8px;
    padding: 9px 2px; border-bottom: 1px dashed var(--line); font-size: 0.95rem;
  }
  .recap li::before { content: counter(r); color: var(--rust); font-weight: 700; font-variant-numeric: tabular-nums; }
  .recap .k { color: var(--ink-soft); }
  .recap .v { font-weight: 600; text-align: right; }
  .actions { display: grid; gap: 10px; }
  .linkish {
    background: none; border: 0; font: inherit; font-size: 0.92rem; color: var(--ink-soft);
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 10px; margin-top: 6px;
  }

  /* Tahmin ekranı */
  .guess { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 8px 0 6px; }
  .guess-num {
    font-family: var(--serif); font-weight: 700; font-size: clamp(4.2rem, 22vw, 5.5rem); line-height: 1;
    color: var(--green-deep); min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums;
  }
  .step {
    width: 56px; height: 56px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
    font: inherit; font-size: 1.7rem; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .step:hover { border-color: var(--roast-3); }
  .step:active { transform: scale(0.95); }
  .step:focus-visible, .guess-range:focus-visible { outline: 3px solid var(--rust); outline-offset: 3px; }
  .guess-num.empty { color: #C9B9A6; }
  .guess-range {
    -webkit-appearance: none; appearance: none; background: transparent;
    width: 100%; height: 44px; margin: 4px 0 0; cursor: pointer; --thumb: var(--green-deep);
  }
  .guess-range.unset { --thumb: #B7A99A; }
  .guess-range::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: var(--line); }
  .guess-range::-moz-range-track { height: 6px; border-radius: 999px; background: var(--line); }
  .guess-range::-webkit-slider-thumb {
    -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%;
    background: var(--thumb); border: 3px solid var(--paper); box-shadow: 0 1px 3px rgba(43, 27, 18, 0.3);
  }
  .guess-range::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--thumb); border: 3px solid var(--paper); box-shadow: 0 1px 3px rgba(43, 27, 18, 0.3);
  }
  .range-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--ink-soft); margin: -4px 2px 26px; }
  .guess-actions { display: grid; gap: 4px; justify-items: center; }
  .guess-actions .cta { width: 100%; }

  /* Tahmin ↔ gerçek karşılaştırması */
  .compare {
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin: 20px 0 0; text-align: left;
  }
  .cmp-row { display: grid; grid-template-columns: 4.6em 1fr 2em; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.92rem; }
  .cmp-row .lab { color: var(--ink-soft); }
  .cmp-row b { text-align: right; font-variant-numeric: tabular-nums; }
  .cmp-bar { height: 12px; border-radius: 999px; background: var(--bg); overflow: hidden; }
  .cmp-bar i { display: block; height: 100%; border-radius: 999px; }
  .cmp-bar i.g { background: var(--green-deep); }
  .cmp-bar i.r { background: var(--rust); }
  .cmp-text { margin: 10px 0 0; font-size: 0.95rem; }

  @media (min-width: 600px) {
    .screen { padding-top: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen, .progress-cover, .opt { transition: none; }
    .counter.bump, .steam path { animation: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="./">kahvelerce<span>.com</span></a>
    <span class="counter" id="counter" aria-live="polite" aria-atomic="true" hidden>Karar: 0</span>
  </div>
  <div class="progress-wrap" id="progressWrap" hidden>
    <div class="progress" role="progressbar" aria-label="İlerleme" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
      <div class="progress-cover" id="progressCover"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="screen" id="screen"></div>
  <noscript><p>Bu uygulama JavaScript ile çalışıyor. Tarayıcında JavaScript'i açıp sayfayı yenile.</p></noscript>
</main>

<script>
(function () {
  'use strict';

  /* ---------- Karar listesi ----------
     options: dizi ya da (cevaplar) => dizi
     when:    (cevaplar) => boolean  (koşul)
     2'den az seçenek kalan soru sorulmaz ve karar sayılmaz. */
  var CUPS = { fincan: 'Fincan', kupa: 'Kupa', cam: 'Cam bardak', karton: 'Karton bardak', termos: 'Kendi termosum' };
  var METHODS = [
    { v: 'espresso', t: 'Espresso', d: 'Basınçlı ve hızlı' },
    { v: 'filtre', t: 'Filtre (V60)', d: 'Kâğıt filtreden süzülür' },
    { v: 'french', t: 'French press', d: 'Demlenir, süzgeçle bastırılır' },
    { v: 'turk', t: 'Türk kahvesi', d: 'Cezvede, telvesiyle' },
    { v: 'moka', t: 'Moka pot', d: 'Ocakta, buhar basıncıyla' },
    { v: 'coldbrew', t: 'Cold brew', d: 'Soğuk suda saatlerce demlenir' }
  ];

  var QUESTIONS = [
    { id: 'place', label: 'Mekân', title: 'Kahveni nerede içeceksin?',
      hint: 'Ortada daha kahve yok ama ilk kararını verdin bile.',
      options: [{ v: 'ev', t: 'Evde' }, { v: 'kafe', t: 'Kafede' }, { v: 'yol', t: 'Yolda' }] },

    { id: 'cafeType', label: 'Kafe', title: 'Nasıl bir kafe?',
      when: function (s) { return s.place === 'kafe'; },
      hint: 'Kahve dünyasında "dalgalar" var: ilki hazır kahve, ikincisi zincir kafeler, üçüncüsü çekirdeğin hikâyesini anlatan nitelikli kahveciler.',
      options: [
        { v: 'mahalle', t: 'Mahalle kahvecisi', d: 'Siparişini sen söylemeden hazırlamaya başlarlar' },
        { v: 'zincir', t: 'Zincir kafe', d: 'Her şehirde aynı menü. Sürpriz yok, bu da bir rahatlık.' },
        { v: 'nitelikli', t: 'Nitelikli kahveci', d: 'Çekirdeğin hangi tepede yetiştiğini anlatırlar. Sormasan da.' },
        { v: 'kitap', t: 'Kitap kafe', d: 'Üç sayfa okursun, iki kahve içersin' }
      ] },

    { id: 'seat', label: 'Masa', title: 'Hangi masaya oturuyorsun?',
      when: function (s) { return s.place === 'kafe'; },
      hint: 'Kafede ilk karar menüde değil, kapıda verilir: nereye oturacağın.',
      options: [
        { v: 'cam', t: 'Cam kenarı', d: 'Kahve artı manzara, aynı fiyata' },
        { v: 'priz', t: 'Prizin yanı', d: 'Şarj %9. Öncelikler belli.' },
        { v: 'kose', t: 'Köşe masa', d: 'Herkesi görürsün, kimse seni rahatsız etmez' },
        { v: 'disari', t: 'Dışarısı', d: 'Hava nasıl olursa olsun. Battaniye varsa tamam.' }
      ] },

    { id: 'temp', label: 'Sıcaklık', title: 'Sıcak mı, soğuk mu?',
      hint: 'Ocakta buzlu latte içenleri yargılamıyoruz. Hangi ocak olduğunu da sormuyoruz.',
      options: [{ v: 'sicak', t: 'Sıcak' }, { v: 'soguk', t: 'Soğuk' }] },

    { id: 'method', label: 'Demleme', title: 'Nasıl demlensin?',
      hint: 'Aynı çekirdek, farklı bir yöntemle bambaşka bir fincana dönüşür.',
      options: function (s) {
        return s.temp === 'soguk'
          ? METHODS.filter(function (o) { return ['espresso', 'filtre', 'coldbrew'].indexOf(o.v) > -1; })
          : METHODS.filter(function (o) { return o.v !== 'coldbrew'; });
      } },

    { id: 'turkBrew', label: 'Pişirme', title: 'Cezve nerede pişsin?',
      when: function (s) { return s.method === 'turk'; },
      hint: 'Usta tavsiyesi: Türk kahvesi kısık ateşte, acele etmeden pişer. Acele eden cezve taşar.',
      options: [{ v: 'ocak', t: 'Ocakta', d: 'Klasik cezve' }, { v: 'kum', t: 'Kumda', d: 'Kızgın kumda, yavaş yavaş' }, { v: 'makine', t: 'Makinede', d: 'Düğmeye bas, bekle' }] },

    { id: 'decaf', label: 'Kafein', title: 'Kafeinli mi, kafeinsiz mi?',
      hint: 'Küçük bir not: kafeinsiz kahvede de bir miktar kafein kalır, sıfır değildir.',
      options: [{ v: 'kafeinli', t: 'Kafeinli' }, { v: 'kafeinsiz', t: 'Kafeinsiz' }] },

    { id: 'bean', label: 'Çekirdek', title: 'Hangi çekirdek?',
      hint: 'Robusta, Arabica\'ya göre kabaca iki kat kafein içerir; tadı da daha sert ve acıdır.',
      options: [{ v: 'arabica', t: 'Arabica', d: 'Daha yumuşak ve aromatik' }, { v: 'robusta', t: 'Robusta', d: 'Daha sert, daha kafeinli' }, { v: 'harman', t: 'Harman', d: 'İkisinin karışımı' }] },

    { id: 'origin', label: 'Menşei', title: 'Çekirdek nereden gelsin?',
      when: function (s) { return s.bean === 'arabica'; },
      hint: 'Kahve, ekvator çevresindeki "kahve kuşağı"nda yetişir. Arabica\'nın anavatanı Etiyopya kabul edilir.',
      options: [{ v: 'etiyopya', t: 'Etiyopya' }, { v: 'kolombiya', t: 'Kolombiya' }, { v: 'brezilya', t: 'Brezilya' }, { v: 'kenya', t: 'Kenya' }, { v: 'guatemala', t: 'Guatemala' }] },

    { id: 'process', label: 'İşleme', title: 'Meyvesinden nasıl ayrılsın?',
      when: function (s) { return s.bean === 'arabica'; },
      hint: 'Evet, meyve. Kahve çekirdeği aslında "kahve kirazı" denen kırmızı bir meyvenin çekirdeği.',
      options: [{ v: 'yikanmis', t: 'Yıkanmış', d: 'Meyve eti yıkanıp ayrılır; temiz, parlak tat' }, { v: 'natural', t: 'Natural', d: 'Meyveyle birlikte kurutulur; daha meyvemsi' }, { v: 'honey', t: 'Honey', d: 'Meyve etinin bir kısmı kalır; ikisinin arası' }] },

    { id: 'roast', label: 'Kavurma', title: 'Ne kadar kavrulsun?',
      hint: 'Çiğ kahve çekirdeği yeşildir. O bildiğimiz kahverengi tamamen kavurmanın eseri.',

    french: function () {

        '<g clip-path="url(#' + id + ')"><rect x="-30" y="-72" width="60" height="66" fill="#3A2418"/><rect x="-30" y="-72" width="60" height="5" fill="#8E5D37"/></g>' +
        ln('M-27 -72 L27 -72', IN, 2) + ln('M0 -72 L0 -136', IN, 2.6) +

        sh('M-32 -104 L32 -104 L30 -112 L-30 -112Z', IN) +
        sh('M-31 -8 L31 -8 L29 0 L-29 0Z', IN);
    },
    moka: function () {
      var al = '#D8CFC2';
      return sh('M28 -92 L50 -88 L46 -60 L30 -62Z', IN) +
        sh('M-28 0 L-32 -40 L-14 -48 L14 -48 L32 -40 L28 0 Z', al) +
        ln('M-9 -47 L-11 -1 M9 -47 L11 -1', IN, 1.5, 0.45) +
        sh('M-16 -48 L16 -48 L16 -53 L-16 -53 Z', IN) +
        sh('M-14 -53 L-30 -60 L-24 -100 L24 -100 L30 -60 L14 -53 Z', al) +
        ln('M-8 -55 L-9 -98 M8 -55 L9 -98', IN, 1.5, 0.45) +
        sh('M-24 -96 L-38 -103 L-27 -88', al, 2.2) +
        sh('M-6 -100 L6 -100 L4 -109 L-4 -109 Z', IN);
    },
    turk: function () {
      return ln('M-22 -50 L-74 -84', '#3B2A20', 7) + ln('M-60 -75 L-74 -84', '#8E5D37', 7) +
        sh('M-24 -58 C-30 -40 -28 -10 -18 0 L18 0 C28 -10 30 -40 24 -58', RU) +
        '<circle cx="-10" cy="-30" r="2" fill="#C2654A"/><circle cx="8" cy="-40" r="1.6" fill="#C2654A"/><circle cx="12" cy="-18" r="1.8" fill="#C2654A"/>' +
        sh('M-28 -60 C-14 -66 14 -66 28 -60 L38 -66 L32 -57 C14 -53 -14 -53 -28 -60Z', '#8E3A25');
    },
    coldbrew: function () {
      var id = 'cb' + uid;
      var o = 'M-20 -126 L-20 -112 C-20 -104 -30 -100 -30 -88 L-30 -8 C-30 -3 -26 0 -21 0 L21 0 C26 0 30 -3 30 -8 L30 -88 C30 -100 20 -104 20 -112 L20 -126 Z';
      return clip(id, o) + fl(o, GL, 0.6) +
        '<g clip-path="url(#' + id + ')"><rect x="-32" y="-96" width="64" height="98" fill="#4A2C1A"/></g>' +
        fl('M-30 -64 L30 -64 L30 -30 L-30 -30Z', PA) + ln('M-30 -64 L30 -64 L30 -30 L-30 -30Z', IN, 1.8) +
        ln('M-16 -52 L16 -52 M-10 -42 L10 -42', RU, 2.4) +
        ln('M-22 -84 L-22 -70 M-22 -24 L-22 -12', '#fff', 3, 0.5) + ln(o) +
        sh('M-22 -126 L22 -126 L22 -138 L-22 -138Z', IN);
    },
    espresso: function () { // alet yerine kavrulma tayfında üç çekirdek
      return bean(-34, -10, 80, '#A3AE71', '#6E7B45', 1.15) +
        bean(-4, -9, 104, '#BE8B4F', '#8E5D37', 1.15) +
        bean(26, -10, 70, '#3A2418', '#8E5D37', 1.15);
    }
  };

  /* Yanında */
  var SIDES = {
    su: function () {
      var id = 'su' + uid, o = 'M-16 -52 L-13 -3 C-13 -1 -11 0 -9 0 L9 0 C11 0 13 -1 13 -3 L16 -52';
      return clip(id, o + 'Z') + fl(o + 'Z', GL, 0.6) +
        '<g clip-path="url(#' + id + ')"><rect x="-20" y="-34" width="40" height="36" fill="#CFE3DE"/></g>' +
        ln('M-9 -44 L-7 -10', '#fff', 2.4, 0.7) + ln(o) + ln(ell(16, 2.5, -52), IN, 2);
    },
    lokum: function () {
      var cubeL = function (x, y, r) {
        return '<g transform="translate(' + x + ' ' + y + ') rotate(' + r + ')">' + sh('M-9 -9 L9 -9 L9 9 L-9 9Z', '#F4DED4', 2.2) +
          '<circle cx="-3" cy="-4" r="1" fill="#fff"/><circle cx="4" cy="2" r="1" fill="#fff"/><circle cx="-2" cy="5" r="0.9" fill="#fff"/></g>';
      };
      return sh(ell(28, 4, -3), PA) + cubeL(-10, -16, -8) + cubeL(10, -18, 12);
    },
    tatli: function () {
      return sh('M-18 -20 C-18 -31 -10 -38 0 -38 C11 -38 18 -30 18 -20 C18 -9 10 -2 0 -2 C-11 -2 -18 -9 -18 -20Z', '#C9A16A') +
        '<circle cx="-6" cy="-26" r="2.6" fill="#3A2418"/><circle cx="6" cy="-20" r="2.6" fill="#3A2418"/><circle cx="-2" cy="-12" r="2.4" fill="#3A2418"/><circle cx="8" cy="-30" r="2" fill="#3A2418"/>';
    }
  };

  function place(x, inner) { return '<g transform="translate(' + x + ' 202)">' + inner + '</g>'; }

  function sceneSVG(a, label) {
    uid++;
    var kind = containerKind(a), t = drinkTop(a);
    var side = SIDES[a.side] ? a.side : null, dev = DEVICES[a.method];
    var cx = side ? 178 : 196, hot = a.temp !== 'soguk', top = TOPS[kind];
    var body = ln('M14 203 C80 199 180 205 306 201', '#6B5546', 2, 0.45);
    if (dev) body += place(78, dev(a));
    body += place(cx, CONT[kind](t, a) + (hot && top ? steam(top - 6) : ''));
    if (side) body += place(286, SIDES[side]());
    return '<svg viewBox="0 0 320 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + label + '">' +
      '<defs><filter id="rough' + uid + '" x="-5%" y="-5%" width="110%" height="110%">' +
      '<feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/>' +
      '<feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs>' +
      '<g filter="url(#rough' + uid + ')">' + body + '</g></svg>';
  }

  // Node ile test edebilmek için (tarayıcıda çalışmaz)
  if (typeof document === 'undefined') {
    globalThis.KK = { QUESTIONS: QUESTIONS, stats: stats, isAsked: isAsked, optionsFor: optionsFor, coffeeName: coffeeName, sceneSVG: sceneSVG };
    return;
  }

  /* ---------- Uygulama ---------- */
  var els = {
    screen: document.getElementById('screen'),
    counter: document.getElementById('counter'),
    progressWrap: document.getElementById('progressWrap'),
    progress: document.getElementById('progress'),
    cover: document.getElementById('progressCover')
  };
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var view = 'intro', history = [], current = -1, pendingPrev = null, busy = false;
  var GUESS_MIN = 1, GUESS_MAX = 30, GUESS_MID = 15;
  var guess = null, guessDraft = null; // null = henüz tahmin yok ("?")

  function answers() {
    var a = {};
    history.forEach(function (h) { a[QUESTIONS[h.i].id] = h.v; });
    return a;
  }
  function nextIndex(from, a) {
    for (var i = from; i < QUESTIONS.length; i++) if (isAsked(QUESTIONS[i], a)) return i;
    return -1;
  }

  function updateHeader(bump) {
    var show = view === 'q' || view === 'result';
    els.counter.hidden = !show;
    els.progressWrap.hidden = !show;
    els.counter.textContent = 'Karar: ' + history.length;
    if (bump && !reduceMotion) {
      els.counter.classList.remove('bump'); void els.counter.offsetWidth; els.counter.classList.add('bump');
    }
    var pct = 0;
    if (view === 'result') pct = 100;
    else if (view === 'q') {
      var done = history.length, remaining = stats(current, condState(answers())).max;
      pct = Math.round(done / (done + remaining) * 100);
    }
    els.cover.style.width = (100 - pct) + '%';
    els.progress.setAttribute('aria-valuenow', pct);
  }

  function go(render, dir) {
    var sc = els.screen;
    var done = function () {
      window.scrollTo(0, 0);
      var h = sc.querySelector('h1, h2');
      if (h) h.focus({ preventScroll: true });
      busy = false;
    };
    if (reduceMotion) { render(); done(); return; }
    busy = true;
    sc.classList.add('out', dir === 'back' ? 'to-right' : 'to-left');
    setTimeout(function () {
      render();
      sc.classList.remove('out', 'to-right', 'to-left');
      sc.classList.add('pre', dir === 'back' ? 'from-left' : 'from-right');
      void sc.offsetWidth;
      sc.classList.remove('pre', 'from-left', 'from-right');
      done();
    }, 170);
  }

  function renderIntro() {
    view = 'intro';
    els.screen.innerHTML =
      '<section class="intro">' +
        '<div class="intro-art">' + sceneSVG({ method: 'espresso', milk: 'var', foam: 'bol', temp: 'sicak', cup: 'fincan' }, 'Köpüklü bir fincan kahve ve yeşilden koyuya üç kahve çekirdeği') + '</div>' +
        '<p class="hello">Hoş geldin! Kahveni nasıl alırsın?</p>' +
        '<p class="hello-by">— Her baristanın ilk sorusu</p>' +
        '<h1 tabindex="-1">Bir kahve,<br>kaç <em>karar?</em></h1>' +
        '<p class="lede">Basit bir soru gibi duruyor. Ama cevabı aslında bir sürü küçük karar. Hadi sayalım.</p>' +
        '<button type="button" class="cta" data-act="start">Başla</button>' +
        '<p class="fine">Yaklaşık bir dakika · Kayıt yok · Çerez yok</p>' +
      '</section>';
    updateHeader(false);
  }
  function renderGuess() {
    view = 'guess';
    var empty = guessDraft === null;
    els.screen.innerHTML =
      '<button type="button" class="back" data-act="home"><span aria-hidden="true">←</span> Geri</button>' +
      '<p class="eyebrow">Başlamadan önce</p>' +
      '<h2 class="q-title" tabindex="-1">Sence bir kahve için kaç karar vereceksin?</h2>' +
      '<p class="hint">Tahmin karar sayılmaz. Teknik olarak sayılır ama bu seferlik görmezden geliyoruz.</p>' +
      '<div class="guess">' +
        '<button type="button" class="step" data-act="minus" aria-label="Bir azalt">−</button>' +
        '<output class="guess-num' + (empty ? ' empty' : '') + '" id="guessOut" aria-live="polite">' + (empty ? '?' : guessDraft) + '</output>' +
        '<button type="button" class="step" data-act="plus" aria-label="Bir artır">+</button>' +
      '</div>' +
      '<input type="range" class="guess-range' + (empty ? ' unset' : '') + '" id="guessRange" min="' + GUESS_MIN + '" max="' + GUESS_MAX + '" value="' + (empty ? GUESS_MID : guessDraft) + '" aria-label="Tahminin">' +
      '<div class="range-labels"><span>' + GUESS_MIN + '</span><span>' + GUESS_MAX + '</span></div>' +
      '<div class="guess-actions">' +
        '<button type="button" class="cta" id="beginBtn" data-act="begin"' + (empty ? ' disabled' : '') + '>' + (empty ? 'Önce bir sayı seç' : 'Tahminim bu, başlayalım') + '</button>' +
        '<button type="button" class="linkish" data-act="skip">Tahmin etmeden başla</button>' +
      '</div>';
    updateHeader(false);
  }
  function setGuessDraft(v) {
    guessDraft = Math.max(GUESS_MIN, Math.min(GUESS_MAX, v));
    var out = document.getElementById('guessOut'), rng = document.getElementById('guessRange');
    var btn = document.getElementById('beginBtn');
    if (out) { out.textContent = guessDraft; out.classList.remove('empty'); }
    if (rng) { rng.value = guessDraft; rng.classList.remove('unset'); }
    if (btn) { btn.disabled = false; btn.textContent = 'Tahminim bu, başlayalım'; }
  }
  function stepGuess(d) { setGuessDraft((guessDraft === null ? GUESS_MID : guessDraft) + d); }

  function compareHTML(n) {
    if (guess === null) return '';
    var top = Math.max(guess, n);
    var fmt = function (x) { return x.toLocaleString('tr-TR', { maximumFractionDigits: 1 }); };
    var text;
    if (guess === n) text = 'Tam isabet. Ya kendini çok iyi tanıyorsun ya da bu uygulamayı daha önce denedin.';
    else if (guess < n) {
      var ratio = n / guess;
      text = ratio >= 1.5
        ? 'Gerçek sayı tahmininin <b>' + fmt(ratio) + ' katı</b>. Küçük kararlar işte böyle görünmez olur.'
        : 'Tahmininden <b>' + (n - guess) + ' karar</b> fazla. Yakındın ama kahve yine de seni yakaladı.';
    } else {
      text = 'Tahmininden <b>' + (guess - n) + ' karar</b> az verdin. Kararlarının farkındasın galiba.';
    }
    var row = function (lab, v, cls) {
      return '<div class="cmp-row"><span class="lab">' + lab + '</span>' +
        '<span class="cmp-bar"><i class="' + cls + '" style="width:' + Math.round(v / top * 100) + '%"></i></span>' +
        '<b>' + v + '</b></div>';
    };
    return '<div class="compare">' + row('Tahminin', guess, 'g') + row('Gerçek', n, 'r') +
      '<p class="cmp-text">' + text + '</p></div>';
  }

  function renderQuestion(i) {
    view = 'q'; current = i;
    var q = QUESTIONS[i], a = answers();
    var opts = optionsFor(q, a), title = val(q.title, a), hint = val(q.hint, a);
    var prev = (pendingPrev && pendingPrev.i === i) ? pendingPrev.v : null;
    var hasDesc = opts.some(function (o) { return o.d || o.sw; });
    var cols = 1;
    if (!hasDesc) {
      var maxLen = Math.max.apply(null, opts.map(function (o) { return o.t.length; }));
      if (opts.length === 2 && maxLen <= 14) cols = 2;
      else if (opts.length === 3 && maxLen <= 8) cols = 3;
      else if (opts.length === 4 && maxLen <= 13) cols = 2;
    }
    els.screen.innerHTML =
      '<button type="button" class="back" data-act="back"><span aria-hidden="true">←</span> Geri</button>' +
      '<p class="eyebrow">' + (history.length + 1) + '. karar · ' + q.label + '</p>' +
      '<h2 class="q-title" tabindex="-1">' + title + '</h2>' +
      '<p class="hint">' + hint + '</p>' +
      '<div class="options cols-' + cols + '" role="group" aria-label="' + title + '">' +
        opts.map(function (o) {
          var was = o.v === prev;
          return '<button type="button" class="opt' + (was ? ' was' : '') + '" data-v="' + o.v + '">' +
            (o.sw ? '<span class="sw" style="background:' + o.sw + '"></span>' : '') +
            '<span class="txt">' + o.t + (o.d ? '<small>' + o.d + '</small>' : '') + '</span>' +
            (was ? '<em class="tag">önceki</em>' : '') +
          '</button>';
        }).join('') +
      '</div>';
    updateHeader(false);
  }

  function quip(n) {
    if (n <= 11) return 'Hızlı ve net. Barista seni sever.';
    if (n <= 14) return 'Sıradan bir sabah için gayet hareketli bir karar trafiği.';
    if (n <= 16) return 'Kahve konusunda ciddi bir insansın.';
    return 'Bu bir kahve değil, bir manifesto.';
  }

  function renderResult() {
    view = 'result'; current = -1;
    var a = answers(), n = history.length, all = stats(0, {}), name = coffeeName(a);
    var recap = history.map(function (h) {
      var q = QUESTIONS[h.i];
      var o = optionsFor(q, a).filter(function (x) { return x.v === h.v; })[0];
      return '<li><span class="k">' + q.label + '</span><span class="v">' + (o ? o.t : h.v) + '</span></li>';
    }).join('');
    els.screen.innerHTML =
      '<section class="result">' +
        '<div class="cupviz">' + sceneSVG(a, name) + '</div>' +
        '<p class="eyebrow">Siparişin hazır</p>' +
        '<h2 class="coffee-name" tabindex="-1">' + name + '</h2>' +
        '<p class="verdict"><span>Bu kahve için</span><strong><span class="num" id="num">' + n + '</span> karar</strong><span>verdin.</span></p>' +
        '<p class="quip">' + quip(n) + '</p>' +
        compareHTML(n) +
        '<p class="stat">Bu menüyle toplam <b>' + all.n.toLocaleString('tr-TR') + '</b> farklı kahve kombinasyonu mümkün. ' +
          'En kısa rota <b>' + all.min + '</b>, en uzun rota <b>' + all.max + '</b> karar sürüyor.</p>' +
        '<h3 class="recap-title">Verdiğin kararlar</h3>' +
        '<ol class="recap">' + recap + '</ol>' +
        '<div class="actions">' +
          '<a class="cta" href="blog/gunluk-kararlar.html">Günde kaç karar? Yazıyı oku →</a>' +
          '<button type="button" class="ghost" data-act="start">Tekrar dene</button>' +
        '</div>' +
        '<button type="button" class="linkish" data-act="back">Son kararı değiştir</button>' +
      '</section>';
    updateHeader(false);
    countUp(document.getElementById('num'), n);
  }

  function countUp(el, n) {
    if (reduceMotion || !el) return;
    var t0 = null, dur = 700;
    el.textContent = '0';
    function step(t) {
      if (!t0) t0 = t;
      var p = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // Başla / Tekrar dene → önce tahmin ekranı
  function start() {
    history = []; pendingPrev = null;
    if (guess !== null) guessDraft = guess;
    go(renderGuess, 'fwd');
  }
  function begin(withGuess) {
    if (busy) return;
    guess = withGuess ? guessDraft : null;
    history = []; pendingPrev = null;
    var i = nextIndex(0, {});
    go(function () { renderQuestion(i); }, 'fwd');
  }

  function choose(v, btn) {
    if (busy || view !== 'q') return;
    busy = true;
    btn.classList.add('picked');
    var i = current;
    setTimeout(function () {
      history.push({ i: i, v: v });
      pendingPrev = null;
      var nxt = nextIndex(i + 1, answers());
      updateHeader(true);
      busy = false;
      go(function () { nxt < 0 ? renderResult() : renderQuestion(nxt); }, 'fwd');
    }, reduceMotion ? 0 : 140);
  }

  function back() {
    if (busy) return;
    if (!history.length) { go(renderGuess, 'back'); return; }
    var h = history.pop();
    pendingPrev = h;
    updateHeader(true);
    go(function () { renderQuestion(h.i); }, 'back');
  }

  els.screen.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    var act = t.dataset.act;
    if (act === 'start') start();
    else if (act === 'back') back();
    else if (act === 'home') { if (!busy) go(renderIntro, 'back'); }
    else if (act === 'minus') stepGuess(-1);
    else if (act === 'plus') stepGuess(1);
    else if (act === 'begin') { if (guessDraft !== null) begin(true); }
    else if (act === 'skip') begin(false);
    else if (t.dataset.v !== undefined) choose(t.dataset.v, t);
  });
  els.screen.addEventListener('input', function (e) {
    if (e.target.id === 'guessRange') setGuessDraft(parseInt(e.target.value, 10));
  });

  renderIntro();
})();
